<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Agua - Campo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dfe8d5;
            color: #263a24;
        }

        header {
            background: #355e3b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            background: #fffdf5;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .tanque {
            width: 180px;
            height: 300px;
            margin: 20px auto;
            border: 6px solid #555;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            background: #eee;
        }

        .agua {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #2196f3;
            height: 0%;
            transition: height 1s;
        }

        /* PORCENTAJE DENTRO DEL TANQUE */
        .porcentaje-tanque {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: white;
            z-index: 2;
            text-shadow: 2px 2px 4px #333;
        }

        .dato {
            margin: 15px 0;
            padding: 15px;
            background: #edf2e8;
            border-radius: 10px;
        }

        .valor {
            font-size: 28px;
            font-weight: bold;
            color: #355e3b;
        }

        .estado {
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🌾 Control de Agua</h1>
    <p>Monitoreo del tanque del campo</p>
</header>

<div class="contenedor">

    <h2>💧 Nivel del tanque</h2>

    <div class="tanque">

        <!-- AGUA -->
        <div class="agua" id="agua"></div>

        <!-- PORCENTAJE DENTRO DEL TANQUE -->
        <div class="porcentaje-tanque" id="porcentajeTanque">
            0%
        </div>

    </div>

    <div class="dato">
        <div>Altura del agua</div>
        <div class="valor" id="altura">0 cm</div>
    </div>

    <div class="dato">
        <div>Porcentaje</div>
        <div class="valor" id="porcentaje">0%</div>
    </div>

    <div class="dato">
        <div>Estado</div>
        <div class="estado" id="estado">MUY BAJO</div>
    </div>

</div>

<script>

    // ALTURA DEL AGUA EN CENTÍMETROS
    // Cambiar este valor para probar
    let altura = 0;

    function actualizarNivel() {

        let porcentaje;
        let estado;

        // Calcular porcentaje
        porcentaje = (altura / 200) * 100;

        // Determinar estado
        if (altura >= 0 && altura < 50) {
            estado = "VACIO";
        } 
        else if (altura >= 50 && altura < 100) {
            estado = "BAJO";
        } 
        else if (altura >= 100 && altura < 150) {
            estado = "MEDIO";
        } 
        else if (altura >= 150 && altura <= 200) {
            estado = "ALTO";
        }

        // Mostrar altura
        document.getElementById("altura").textContent =
            altura + " cm";

       

        // Mostrar porcentaje DENTRO del tanque
        document.getElementById("porcentajeTanque").textContent =
            porcentaje.toFixed(0) + "%";

        // Mostrar estado
        document.getElementById("estado").textContent =
            estado;

        // Llenar tanque
        document.getElementById("agua").style.height =
            porcentaje + "%";
    }

    actualizarNivel();

</script>

</body>
</html>
