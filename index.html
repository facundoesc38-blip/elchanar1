<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Agua - Campo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dfe8d5;
            color: #263a24;
        }

        /* ENCABEZADO */
        header {
            background: #355e3b;
            color: white;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 6px solid #8b6f47;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        /* CONTENEDOR */
        .contenedor {
            width: 92%;
            max-width: 500px;
            margin: 30px auto;
            background: #fffdf5;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border: 3px solid #8b6f47;
        }

        .titulo {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* TANQUE */
        .tanque {
            width: 190px;
            height: 300px;
            margin: auto;
            border: 6px solid #555;
            border-radius: 18px;
            background: #e8e8e8;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .agua {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: #2387c9;
            transition: height 1s ease;
        }

        /* MARCAS DEL TANQUE */
        .marca {
            position: absolute;
            right: 0;
            width: 25px;
            border-top: 2px solid #555;
            z-index: 2;
        }

        .marca25 {
            bottom: 25%;
        }

        .marca50 {
            bottom: 50%;
        }

        .marca75 {
            bottom: 75%;
        }

        /* PORCENTAJE */
        .porcentaje {
            margin-top: 25px;
            font-size: 48px;
            font-weight: bold;
            color: #355e3b;
        }

        /* ESTADO */
        .estado {
            font-size: 27px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* INFORMACIÓN */
        .info {
            margin-top: 25px;
            padding: 15px;
            background: #edf2e8;
            border-radius: 12px;
            font-size: 16px;
        }

        .campo {
            margin-top: 25px;
            font-size: 15px;
            color: #68745f;
        }

        /* PIE */
        footer {
            text-align: center;
            padding: 20px;
            color: #53634d;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🌾 Control de Agua</h1>
    <p>Monitoreo del tanque del campo</p>
</header>


<div class="contenedor">

    <div class="titulo">
        💧 Nivel del tanque
    </div>

    <div class="tanque">

        <div class="marca marca25"></div>
        <div class="marca marca50"></div>
        <div class="marca marca75"></div>

        <div class="agua" id="agua"></div>

    </div>

    <div class="porcentaje" id="porcentaje">
        0%
    </div>

    <div class="estado" id="estado">
        Vacío
    </div>

    <div class="info">
        <strong>Estado del tanque</strong>
        <br>
        El sistema controla el nivel de agua
        para saber cuándo es necesario llenarlo.
    </div>

    <div class="campo">
        🚜 Sistema de monitoreo rural
    </div>

</div>


<footer>
    Control de agua para el campo
</footer>


<script>

    // ===================================
    // NIVEL DEL TANQUE
    // ===================================

    // CAMBIÁ ESTE NÚMERO PARA PROBAR
    let nivel = 68;


    function actualizarNivel() {

        let agua = document.getElementById("agua");
        let porcentaje = document.getElementById("porcentaje");
        let estado = document.getElementById("estado");


        // Mostrar porcentaje
        porcentaje.textContent = nivel + "%";


        // Mostrar agua dentro del tanque
        agua.style.height = nivel + "%";


        // Determinar estado
        if (nivel <= 25) {

            estado.textContent = "🔴 Vacío";
            estado.style.color = "#c0392b";

        }

        else if (nivel <= 50) {

            estado.textContent = "🟡 Mitad";
            estado.style.color = "#d4a017";

        }

        else if (nivel <= 75) {

            estado.textContent = "🟠 Casi lleno";
            estado.style.color = "#d97706";

        }

        else {

            estado.textContent = "🟢 Lleno";
            estado.style.color = "#3f7d3a";

        }

    }


    actualizarNivel();

</script>

</body>
</html>
